<!DOCTYPE HTML>
<html>
<head>
<title>Canvas Graphics</title>
</head>

<body>

<h2>Canvas</h2>

<canvas id="c1" width="300" height="200" style="border:1px solid black;">
</canvas>

<script>
var c = document.getElementById("c1");
var ctx = c.getContext("2d");

ctx.fillStyle = "green";
ctx.fillRect(20, 80, 100, 60);   

ctx.arc(200, 140, 30, 0, 2 * Math.PI);   
ctx.fillStyle = "black";
ctx.fill();

</script>

</body>
</html>
